name: ghss_mezhathur_election
description: GHSS EVM - Mezhathur school election voting app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.5.0
  google_fonts: ^6.3.1
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.17.2
  pdf: ^3.11.3
  printing: ^5.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/mezhathur_logo.jpeg
    - assets/sounds/vote_beep.wav

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: assets/app_icon.png
  image_path: assets/app_icon.png
  adaptive_icon_background: "#08263D"
  adaptive_icon_foreground: assets/app_icon.png
